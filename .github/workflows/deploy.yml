# Builds and deploys the Worker to Cloudflare (a manual fallback: Cloudflare Workers Builds also deploys
# every push to main).
#
# Public pages are rendered from the database on request (Workers Paid plan) and kept in the edge cache
# for about a minute (worker/index.mjs), so content edits show up on their own: this workflow is only
# needed to deploy code changes. Triggers:
#   - repository_dispatch "content-updated": no longer sent by the admin panel (kept for manual use)
#   - schedule: a periodic redeploy, also refreshes the uploaded images exported at build time
#   - workflow_dispatch: the "Run workflow" button in the Actions tab
name: Build and deploy

on:
  repository_dispatch:
    types: [content-updated]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# One build at a time. If more edits arrive while one is running, a single follow-up run is queued
# (older queued runs are dropped), so a burst of edits costs two builds at most.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      # Reuses Next.js's compile cache between runs (a content-only rebuild recompiles almost nothing)
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Apply database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Build (prerenders every public page from the database)
        run: npm run cf:build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
