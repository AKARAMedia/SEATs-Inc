# Rebuilds the static public pages from the database and deploys the Worker to Cloudflare.
#
# The site runs on the Cloudflare Free plan (10 ms CPU per request), so public pages are prerendered
# at build time and served as static files (see scripts/export-static.ts). That means content edits
# only go live after one of these runs:
#   - repository_dispatch "content-updated": sent by the admin panel after every content save
#     (src/lib/rebuild.ts, needs the GITHUB_DISPATCH_TOKEN secret on the Worker)
#   - schedule: posts scheduled for a future date appear without anyone saving anything
#   - workflow_dispatch: the "Run workflow" button in the Actions tab
name: Build and deploy

on:
  repository_dispatch:
    types: [content-updated]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# One build at a time. If more edits arrive while one is running, a single follow-up run is queued
# (older queued runs are dropped), so a burst of edits costs two builds at most.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      # Reuses Next.js's compile cache between runs (a content-only rebuild recompiles almost nothing)
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Apply database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Build (prerenders every public page from the database)
        run: npm run cf:build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
